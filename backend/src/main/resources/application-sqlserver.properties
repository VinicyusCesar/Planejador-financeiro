spring.application.name=planejador-financeiro
# Endpoint obrigatorio: servidor:porta OU servidor;instanceName=INSTANCIA.
spring.datasource.url=jdbc:sqlserver://${SQLSERVER_ENDPOINT};databaseName=${SQLSERVER_DATABASE:PlanejadorFinanceiro};integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=${SQLSERVER_TRUST_SERVER_CERTIFICATE:false};loginTimeout=5
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/sqlserver
spring.flyway.default-schema=dbo
spring.flyway.schemas=dbo
spring.flyway.create-schemas=false
spring.sql.init.mode=never
financeiro.sqlserver=true
server.address=127.0.0.1
server.port=8080
